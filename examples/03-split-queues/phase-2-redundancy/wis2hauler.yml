# Redundant pair (a/b) per role, per queue -- 4 SUBSCRIBER, 4
# DOWNLOADER, 4 aria2. "a" replicas connect via the primary broker
# pair (meteo.fr/inmet.gov.br), "b" replicas via the secondary pair
# (NOAA/CMA) -- see README.md for why that's the point of this phase,
# not just running duplicates. sub-1-a/sub-1-b also carry CLEANER +
# REPORTER, redundant with each other via leader election; sub-2-a/
# sub-2-b don't need their own -- see README.md.
services:

  sub-1-a:
    image: ghcr.io/golfvert/wis2hauler:2026.09.20
    user: "1000:1000"
    volumes:
      - ./configuration-sub-1-a.yml:/configuration.yml:ro
      - ./logs-sub-1-a:/logs
    ports:
      - "8110:8080"
    restart: unless-stopped
    networks: [wis2hauler]

  sub-1-b:
    image: ghcr.io/golfvert/wis2hauler:2026.09.20
    user: "1000:1000"
    volumes:
      - ./configuration-sub-1-b.yml:/configuration.yml:ro
      - ./logs-sub-1-b:/logs
    ports:
      - "8111:8080"
    restart: unless-stopped
    networks: [wis2hauler]

  down-1-a:
    image: ghcr.io/golfvert/wis2hauler:2026.09.20
    user: "1000:1000"
    volumes:
      - ./configuration-down-1-a.yml:/configuration.yml:ro
      - ./downloads:/downloads
      - ./logs-down-1-a:/logs
    ports:
      - "8112:8080"
    restart: unless-stopped
    networks: [wis2hauler]

  down-1-b:
    image: ghcr.io/golfvert/wis2hauler:2026.09.20
    user: "1000:1000"
    volumes:
      - ./configuration-down-1-b.yml:/configuration.yml:ro
      - ./downloads:/downloads
      - ./logs-down-1-b:/logs
    ports:
      - "8113:8080"
    restart: unless-stopped
    networks: [wis2hauler]

  aria2-1-a:
    image: golfvert/aria2:1.0.7
    environment:
      - TZ=Europe/Paris
      - RPC_SECRET=secret
      - CONCURRENT_DOWNLOADS=32
      - CONNECTIONS_PER_SERVER=16
      - MAX_TRIES=2
      - QUIET=false
    volumes:
      - ./downloads:/downloads
    networks: [wis2hauler]

  aria2-1-b:
    image: golfvert/aria2:1.0.7
    environment:
      - TZ=Europe/Paris
      - RPC_SECRET=secret
      - CONCURRENT_DOWNLOADS=32
      - CONNECTIONS_PER_SERVER=16
      - MAX_TRIES=2
      - QUIET=false
    volumes:
      - ./downloads:/downloads
    networks: [wis2hauler]

  sub-2-a:
    image: ghcr.io/golfvert/wis2hauler:2026.09.20
    user: "1000:1000"
    volumes:
      - ./configuration-sub-2-a.yml:/configuration.yml:ro
      - ./logs-sub-2-a:/logs
    ports:
      - "8120:8080"
    restart: unless-stopped
    networks: [wis2hauler]

  sub-2-b:
    image: ghcr.io/golfvert/wis2hauler:2026.09.20
    user: "1000:1000"
    volumes:
      - ./configuration-sub-2-b.yml:/configuration.yml:ro
      - ./logs-sub-2-b:/logs
    ports:
      - "8121:8080"
    restart: unless-stopped
    networks: [wis2hauler]

  down-2-a:
    image: ghcr.io/golfvert/wis2hauler:2026.09.20
    user: "1000:1000"
    volumes:
      - ./configuration-down-2-a.yml:/configuration.yml:ro
      - ./downloads:/downloads
      - ./logs-down-2-a:/logs
    ports:
      - "8122:8080"
    restart: unless-stopped
    networks: [wis2hauler]

  down-2-b:
    image: ghcr.io/golfvert/wis2hauler:2026.09.20
    user: "1000:1000"
    volumes:
      - ./configuration-down-2-b.yml:/configuration.yml:ro
      - ./downloads:/downloads
      - ./logs-down-2-b:/logs
    ports:
      - "8123:8080"
    restart: unless-stopped
    networks: [wis2hauler]

  aria2-2-a:
    image: golfvert/aria2:1.0.7
    environment:
      - TZ=Europe/Paris
      - RPC_SECRET=secret
      - CONCURRENT_DOWNLOADS=32
      - CONNECTIONS_PER_SERVER=16
      - MAX_TRIES=2
      - QUIET=false
    volumes:
      - ./downloads:/downloads
    networks: [wis2hauler]

  aria2-2-b:
    image: golfvert/aria2:1.0.7
    environment:
      - TZ=Europe/Paris
      - RPC_SECRET=secret
      - CONCURRENT_DOWNLOADS=32
      - CONNECTIONS_PER_SERVER=16
      - MAX_TRIES=2
      - QUIET=false
    volumes:
      - ./downloads:/downloads
    networks: [wis2hauler]

  valkey:
    image: valkey/valkey:9.0.6-alpine3.24
    networks: [wis2hauler]
    command: valkey-server --save "" --appendonly no
    restart: unless-stopped

networks:
  wis2hauler:
    external: true
