# SUBSCRIBER replica 'b' for queue-1 (SECONDARY broker pair) -- see ../README.md.
# Also carries CLEANER+REPORTER, redundant with its 'a'/'b' twin via
# leader election (see ../README.md).
global:
  roles: SUBSCRIBER,CLEANER,REPORTER
  worker: sub-1-b               # unique across every live instance sharing this Redis
  queue: queue-1
  redis:
    mode: "single"
    nodes:
      - "valkey:6379"
  log:
    level: info
    to: stdout
  http-port: 8080
  centre-id: "my-cache"
  global-cache: false

subscriber:
  global-broker:
    - broker: mqtts://wis2broker.globaldata.nws.noaa.gov
      username: everyone
      password: everyone
    - broker: mqtts://gb.wis.cma.cn
      username: everyone
      password: everyone
  mqtt:
    whitelist: [ "cache/a/wis2/jp-jma-gts-to-wis2/#" ]
    blacklist: [ "+/+/+/+/+/+/+/experimental/#" ]

cleaner:
  keep-in-cache: 600  # the hauler will keep files in the cache for this many seconds before deleting them
