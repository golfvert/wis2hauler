# DOWNLOADER for queue-1 -- see ../README.md
global:
  roles: DOWNLOADER
  worker: down-1               # unique across every live instance sharing this Redis
  queue: queue-1
  redis:
    mode: "single"
    nodes:
      - "valkey:6379"
  log:
    level: info
    to: stdout
  http-port: 8080
  centre-id: "my-cache"
  global-cache: false

downloader:
  aria-secret: secret
  aria-url: ws://aria2-1:6800/jsonrpc
  aria-inqueue: 300
  aria-download: /downloads
  rename-to: "topic"
