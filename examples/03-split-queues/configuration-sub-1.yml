# SUBSCRIBER + CLEANER + REPORTER for queue-1 -- see ../README.md
global:
  roles: SUBSCRIBER,CLEANER,REPORTER
  worker: sub-1               # unique across every live instance sharing this Redis
  queue: queue-1
  redis:
    mode: "single"
    nodes:
      - "valkey:6379"
  log:
    level: info
    to: stdout
  http-port: 8080
  centre-id: "my-cache"
  global-cache: false

subscriber:
  global-broker:
    - broker: mqtts://globalbroker.meteo.fr
      username: everyone
      password: everyone
    - broker: mqtts://globalbroker.inmet.gov.br
      username: everyone
      password: everyone
  mqtt:
    whitelist: [ "cache/a/wis2/jp-jma-gts-to-wis2/#" ]
    blacklist: [ "+/+/+/+/+/+/+/experimental/#" ]

cleaner:
  keep-in-cache: 600  # the hauler will keep files in the cache for this many seconds before deleting them
