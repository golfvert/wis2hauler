# SUBSCRIBER only for queue-2 -- no cleaner: section here, see
# ../README.md for why one CLEANER (on sub-1) covers both queues.
global:
  roles: SUBSCRIBER
  worker: sub-2               # unique across every live instance sharing this Redis
  queue: queue-2
  redis:
    mode: "single"
    nodes:
      - "valkey:6379"
  log:
    level: info
    to: stdout
  http-port: 8080
  centre-id: "my-cache"
  global-cache: false

subscriber:
  global-broker:
    - broker: mqtts://globalbroker.meteo.fr
      username: everyone
      password: everyone
    - broker: mqtts://globalbroker.inmet.gov.br
      username: everyone
      password: everyone
  mqtt:
    whitelist: [ "cache/a/wis2/int-eumetsat/#" ]
    blacklist: [ "+/+/+/+/+/+/+/experimental/#" ]
