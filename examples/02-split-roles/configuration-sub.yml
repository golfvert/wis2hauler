# SUBSCRIBER + CLEANER + REPORTER side of the split. No downloader:
# section -- DOWNLOADER isn't in this instance's roles, and doesn't
# need one.
global:
  roles: SUBSCRIBER,CLEANER,REPORTER
  worker: sub               # must be unique across every live instance sharing this Redis
  queue: queue               # shared with the downloader side -- same queue name is what wires them together
  redis:
    mode: "single"
    nodes:
      - "valkey:6379"
  log:
    level: info
    to: stdout
  http-port: 8080
  centre-id: "my-cache"
  global-cache: false

subscriber:
  global-broker:
    - broker: mqtts://globalbroker.meteo.fr
      username: everyone
      password: everyone
    - broker: mqtts://globalbroker.inmet.gov.br
      username: everyone
      password: everyone
  mqtt:
    whitelist:
      - "cache/a/wis2/jp-jma-gts-to-wis2/#"
      - "cache/a/wis2/int-eumetsat/#"   # NEW vs. example 1 -- EUMETSAT's cache-relayed data
    blacklist: [ "+/+/+/+/+/+/+/experimental/#" ]

cleaner:
  keep-in-cache: 600  # the hauler will keep files in the cache for this many seconds before deleting them
