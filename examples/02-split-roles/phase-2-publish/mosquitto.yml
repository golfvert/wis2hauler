# Kept separate from wis2hauler.yml on purpose -- an "additional tool"
# bolted onto the pipeline via global.local-broker, not part of the
# core hauler stack. Add or remove it independently; it only needs to
# be reachable as "mosquitto" on the shared external network.
services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"        # exposed on the host too, so you can `mosquitto_sub -h localhost -t '#' -v` and watch republished notifications live
    networks:
      - wis2hauler
    restart: unless-stopped

networks:
  wis2hauler:
    external: true
