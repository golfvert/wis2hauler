# The core wis2hauler pipeline only -- SUBSCRIBER/CLEANER/REPORTER,
# DOWNLOADER, aria2, valkey. mosquitto (the local broker) and caddy
# (the download-url target) are deliberately NOT in here -- see
# mosquitto.yml / caddy.yml and this phase's README for why.
services:
  wis2hauler-sub:
    image: ghcr.io/golfvert/wis2hauler:2026.09.20
    user: "1000:1000"
    volumes:
      - ./configuration-sub.yml:/configuration.yml:ro
      - ./logs-sub:/logs
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - wis2hauler

  wis2hauler-downloader:
    image: ghcr.io/golfvert/wis2hauler:2026.09.20
    user: "1000:1000"
    volumes:
      - ./configuration-downloader.yml:/configuration.yml:ro
      - ./downloads:/downloads
      - ./logs-downloader:/logs
    ports:
      - "8081:8080"
    restart: unless-stopped
    networks:
      - wis2hauler

  aria2:
    image: golfvert/aria2:1.0.7
    environment:
      - TZ=Europe/Paris
      - RPC_SECRET=secret
      - CONCURRENT_DOWNLOADS=32
      - CONNECTIONS_PER_SERVER=16
      - MAX_TRIES=2
      - QUIET=false
    volumes:
      - ./downloads:/downloads
    networks:
      - wis2hauler

  valkey:
    image: valkey/valkey:9.0.6-alpine3.24
    networks:
      - wis2hauler
    command: valkey-server --save "" --appendonly no
    restart: unless-stopped

networks:
  wis2hauler:
    external: true
