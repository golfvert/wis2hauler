name: Build & release binaries

# Builds standalone wis2hauler executables for every supported platform
# and publishes them, plus a multi-arch (amd64/arm64) Alpine-based Docker
# image on GHCR, under a single version tag: YYYY.MM.X (X starting at 1,
# incrementing per release cut within a calendar month). The tag itself
# is NOT computed here -- it's read verbatim from the repo-root VERSION
# file, which you bump manually and deliberately before pushing:
#
#   bun scripts/bump-version.ts   # updates VERSION, prints the new tag
#   git add VERSION && git commit -m "release: <tag>" && git push
#
# See scripts/bump-version.ts for the full rationale. If VERSION hasn't
# changed since the last successful release (e.g. a push that only
# touched code, without bumping it first), the release/docker jobs
# detect the tag already exists and skip publishing -- build+test still
# run on every push, but nothing gets force-republished under a reused
# tag.
#
# Bun's `--compile` cross-compiles every target from a single Linux
# runner -- no macOS or ARM hardware needed in CI (see docs/deployment.md).
#
# Also builds wis2hauler-tracer, the standalone log-tracing CLI under
# Tracer/ (see Tracer/README.md). Tracer is versioned and released
# INDEPENDENTLY of the main wis2hauler binaries above, on its own
# Tracer/VERSION file and its own tag (tracer-YYYY.MM.X, same format,
# "tracer-" prefixed so it can't collide with a main release tag) --
# see tracer-version/build-tracer/release-tracer below. That's
# deliberate: a Tracer-only change (a new field it should search, a
# bugfix in its log walker, ...) needs to ship without forcing a bump
# -- and therefore a full release -- of the main wis2hauler binaries
# and Docker image, and vice versa. Bump Tracer's own version the same
# way as the main one, just pointed at its own file:
#
#   bun scripts/bump-version.ts Tracer/VERSION
#   git add Tracer/VERSION && git commit -m "release(tracer): <tag>" && git push
#
# Tracer never goes into the Docker image (see the `docker` job's own
# steps, which reference only the main binary's musl artifacts) --
# nothing about it needs a container, and it has no musl targets of its
# own for the same reason.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch: {}
  workflow_call: 

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - run: bun test

      - run: bun run typecheck

  version:
    name: Read release version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.read.outputs.tag }}
      already-released: ${{ steps.check.outputs.already-released }}
    steps:
      - uses: actions/checkout@v4

      - id: read
        name: Read VERSION
        run: |
          tag="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$tag" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]+$ ]]; then
            echo "VERSION does not contain a YYYY.MM.X tag (got: '$tag')." >&2
            echo "Run 'bun scripts/bump-version.ts' and commit the result." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - id: check
        name: Check whether ${{ steps.read.outputs.tag }} is already released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.read.outputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "already-released=true" >> "$GITHUB_OUTPUT"
          else
            echo "already-released=false" >> "$GITHUB_OUTPUT"
          fi

  tracer-version:
    name: Read Tracer release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
      already-released: ${{ steps.check.outputs.already-released }}
    steps:
      - uses: actions/checkout@v4

      - id: read
        name: Read Tracer/VERSION
        run: |
          version="$(tr -d '[:space:]' < Tracer/VERSION)"
          if ! [[ "$version" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]+$ ]]; then
            echo "Tracer/VERSION does not contain a YYYY.MM.X tag (got: '$version')." >&2
            echo "Run 'bun scripts/bump-version.ts Tracer/VERSION' and commit the result." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # "tracer-" prefixed so this tag can never collide with a main
          # wis2hauler release tag in the same repo's tag/release list.
          echo "tag=tracer-$version" >> "$GITHUB_OUTPUT"

      - id: check
        name: Check whether ${{ steps.read.outputs.tag }} is already released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.read.outputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "already-released=true" >> "$GITHUB_OUTPUT"
          else
            echo "already-released=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Standard glibc binaries, for the GitHub Release / direct downloads.
          - name: linux-x64
            target: bun-linux-x64
          - name: linux-arm64
            target: bun-linux-arm64
          - name: darwin-x64
            target: bun-darwin-x64
          - name: darwin-arm64
            target: bun-darwin-arm64
          # musl binaries: required for the Alpine Docker image (see
          # Dockerfile's header comment) -- also published as release
          # assets for anyone running wis2hauler directly on musl-based
          # Linux (Alpine, etc.) outside Docker.
          - name: linux-x64-musl
            target: bun-linux-x64-musl
          - name: linux-arm64-musl
            target: bun-linux-arm64-musl
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Compile standalone binary
        run: |
          mkdir -p dist
          bun build --compile --target=${{ matrix.target }} \
            --outfile dist/wis2hauler-${{ matrix.name }} src/main.ts

      - uses: actions/upload-artifact@v4
        with:
          name: wis2hauler-${{ matrix.name }}
          path: dist/wis2hauler-${{ matrix.name }}
          if-no-files-found: error

  build-tracer:
    name: Build Tracer (${{ matrix.name }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # wis2hauler-tracer (Tracer/): a separate, standalone CLI for
          # chasing one data_id/wnm.id across a deployment's own
          # wis2gc-*.log files -- see Tracer/README.md. Compiled the
          # same way as the main binary above, but only for the plain
          # glibc/macOS targets. Deliberately NOT built for the two musl
          # targets above: those exist solely to feed the `docker` job's
          # Alpine image, and Tracer never runs inside it -- nothing
          # about Tracer needs a container, same reasoning as
          # docs/deployment.md's "Running without Docker" section for
          # the main binary. This job's artifacts are consumed only by
          # the `release-tracer` job below, on Tracer's own independent
          # version/tag -- see this file's header comment and
          # tracer-version above; the main `release` job and the
          # `docker` job never reference them.
          - name: linux-x64
            target: bun-linux-x64
          - name: linux-arm64
            target: bun-linux-arm64
          - name: darwin-x64
            target: bun-darwin-x64
          - name: darwin-arm64
            target: bun-darwin-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Tracer has zero runtime dependencies (only node:*/bun:test
      # builtins plus its own local files -- see Tracer/README.md and
      # Tracer/src/sources.ts's header comment for why it doesn't import
      # from ../src despite living in this same repo), so `bun build
      # --compile` below doesn't actually need a node_modules install to
      # succeed. This step exists anyway for its own devDependency
      # (@types/bun) and so this job matches what a human running the
      # same commands locally from Tracer/ would do.
      - name: Install Tracer's own dependencies
        working-directory: Tracer
        run: bun install

      - name: Compile standalone Tracer binary
        run: |
          mkdir -p dist
          bun build --compile --target=${{ matrix.target }} \
            --outfile dist/wis2hauler-tracer-${{ matrix.name }} Tracer/src/trace.ts

      # Named tracer-dist-* rather than wis2hauler-tracer-* so it can
      # NEVER be swept up by the main `release` job's wis2hauler-*
      # artifact-download pattern below -- that's what keeps the two
      # release tracks (and their download-artifact steps) from racing
      # or double-publishing each other's binaries. The file INSIDE the
      # artifact keeps the wis2hauler-tracer-<platform> name users see
      # on the release page.
      - uses: actions/upload-artifact@v4
        with:
          name: tracer-dist-${{ matrix.name }}
          path: dist/wis2hauler-tracer-${{ matrix.name }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [build, version]
    if: needs.version.outputs.already-released != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: wis2hauler-*

      - name: Flatten artifacts into release-assets/
        run: |
          mkdir -p release-assets
          find artifacts -type f -name 'wis2hauler-*' -exec cp {} release-assets/ \;
          chmod +x release-assets/*
          ls -la release-assets

      # geoip-lite (used only by REPORTER's /caddy country-lookup) needs
      # its .dat files shipped as a `geoip-data` folder next to wherever
      # the binary runs from -- see src/reporter/run.ts's header comment.
      # The Docker image bakes this in itself (docker job, below); anyone
      # running one of the standalone binaries above extracts this
      # alongside it instead (or sets GEODATADIR explicitly) -- see
      # docs/deployment.md. One tarball covers every platform: the data
      # itself is arch-independent.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Package geoip-data.tar.gz
        run: tar -czf release-assets/geoip-data.tar.gz -C node_modules/geoip-lite/data .

      - name: Create release ${{ needs.version.outputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.version.outputs.tag }}" release-assets/* \
            --repo "${{ github.repository }}" \
            --title "wis2hauler ${{ needs.version.outputs.tag }}" \
            --notes "Automatically built from commit ${{ github.sha }}. See the commit history for what changed." \
            --target "${{ github.sha }}"

  release-tracer:
    name: Publish Tracer release
    needs: [build-tracer, tracer-version]
    if: needs.tracer-version.outputs.already-released != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: tracer-dist-*

      - name: Flatten artifacts into release-assets/
        run: |
          mkdir -p release-assets
          find artifacts -type f -name 'wis2hauler-tracer-*' -exec cp {} release-assets/ \;
          chmod +x release-assets/*
          ls -la release-assets

      - name: Create release ${{ needs.tracer-version.outputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.tracer-version.outputs.tag }}" release-assets/* \
            --repo "${{ github.repository }}" \
            --title "wis2hauler-tracer ${{ needs.tracer-version.outputs.version }}" \
            --notes "Standalone wis2hauler-tracer CLI (see Tracer/README.md), released independently of the main wis2hauler binaries. Automatically built from commit ${{ github.sha }}." \
            --target "${{ github.sha }}"

  docker:
    name: Build & push Docker image
    needs: [build, version]
    if: needs.version.outputs.already-released != 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The Docker image needs the musl-targeted binaries (see the
      # Dockerfile's own header comment) -- one per architecture, laid
      # out as dist/<arch>/wis2hauler so the Dockerfile's TARGETARCH-aware
      # COPY can pick the right one per platform during the multi-arch build.
      - uses: actions/download-artifact@v4
        with:
          name: wis2hauler-linux-x64-musl
          path: dist/amd64

      - uses: actions/download-artifact@v4
        with:
          name: wis2hauler-linux-arm64-musl
          path: dist/arm64

      - name: Lay out binaries as the Dockerfile expects
        run: |
          mv dist/amd64/wis2hauler-linux-x64-musl dist/amd64/wis2hauler
          mv dist/arm64/wis2hauler-linux-arm64-musl dist/arm64/wis2hauler
          chmod +x dist/amd64/wis2hauler dist/arm64/wis2hauler

      # geoip-lite's .dat files aren't produced by `bun build --compile`
      # (see src/reporter/run.ts's header comment) -- the image needs
      # them copied in alongside the binary, at dist/geoip-data, which
      # the Dockerfile's own COPY picks up. Same data regardless of
      # target architecture, so this one `bun install` covers both
      # platform builds buildx is about to do.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - run: cp -r node_modules/geoip-lite/data dist/geoip-data

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Buildx attaches build provenance + SBOM attestations to the pushed
          # image by default, which shows up on GHCR as an extra unwanted
          # "unknown/unknown" OS/Arch entry in the manifest list alongside the
          # real linux/amd64 and linux/arm64 ones. Disable both explicitly.
          provenance: false
          sbom: false
          tags: ghcr.io/${{ github.repository }}:${{ needs.version.outputs.tag }}
